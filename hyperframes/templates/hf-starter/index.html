<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="vendor/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #140f0b; }
      #root {
        width: 100%; height: 100%; position: relative;
        font-family: "Segoe UI", Inter, system-ui, sans-serif; color: #fff;
        background: radial-gradient(ellipse at 80% 22%, #5a3d22 0%, #1c140e 45%, #0c0907 100%);
      }
      .clip { position: absolute; inset: 0; }
      #label { top: 640px; height: auto; text-align: center; font-size: 56px; font-weight: 600; opacity: 0.85; }
      #amount { top: 730px; height: auto; text-align: center; font-size: 150px; font-weight: 900; letter-spacing: -0.02em; }
      #accent { top: 930px; height: auto; text-align: center; font-family: Georgia, serif; font-style: italic;
                font-weight: 700; font-size: 96px; color: #5ae182; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1080" data-height="1920">
      <div id="label" class="clip" data-start="0" data-duration="3" data-track-index="0">Saved every month</div>
      <div id="amount" class="clip" data-start="0" data-duration="3" data-track-index="1">₹0</div>
      <div id="accent" class="clip" data-start="0" data-duration="3" data-track-index="2">Sixty thousand</div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const counter = { v: 0 };
      tl.fromTo("#label", { opacity: 0, y: 30 }, { opacity: 0.85, y: 0, duration: 0.4 }, 0);
      tl.to(counter, {
        v: 60000, duration: 1.6, ease: "power3.out",
        onUpdate: () => {
          document.querySelector("#amount").textContent = "₹" + Math.round(counter.v).toLocaleString("en-IN");
        },
      }, 0.2);
      tl.fromTo("#amount", { scale: 0.9 }, { scale: 1, duration: 1.6, ease: "power3.out" }, 0.2);
      tl.fromTo("#accent", { opacity: 0, x: 60 }, { opacity: 1, x: 0, duration: 0.5, ease: "power2.out" }, 1.9);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
